name: 🚀 Deploy to DEV Environment

on:
  push:
    branches: [ develop, main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'GDD/**'
      - 'GDD-BR/**'
      - 'backlog/**'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'development'
        type: choice
        options:
        - development

env:
  AZURE_WEBAPP_NAME: casezero-api-dev
  AZURE_STATIC_WEB_APP_NAME: casezero-web-dev
  AZURE_STATIC_WEB_APP_RG: casezero-web-dev-rg
  AZURE_RESOURCE_GROUP: casezero-api-dev-rg
  AZURE_FUNCTIONAPP_NAME: casegen-func-dev
  AZURE_FUNCTIONAPP_RG: casezero-func-dev-rg
  DOTNET_VERSION: '8.0.x'
  DOTNET_FUNCTIONS_VERSION: '9.0.x'
  NODE_VERSION: '20'

jobs:
  build-and-test:
    name: 🔨 Build & Test
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: 📦 Install frontend dependencies
        run: npm ci
        working-directory: ./frontend

      - name: 🔨 Build frontend
        run: npm run build
        working-directory: ./frontend
        env:
          VITE_API_URL: https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net/api

      - name: 📦 Restore backend dependencies
        run: dotnet restore ./CaseZero-Alternative.sln

      - name: 🔨 Build backend
        run: dotnet build ./CaseZero-Alternative.sln --no-restore --configuration Release

      - name: 🧪 Run backend tests
        run: dotnet test --no-build --configuration Release --verbosity normal
        working-directory: ./backend/CaseZeroApi.Tests
        continue-on-error: false

      - name: 🧪 Run frontend tests
        run: npm run test:run
        working-directory: ./frontend
        continue-on-error: false

      - name: ✅ Validate case.json files against v2 schema
        run: |
          npm install -g ajv-cli@5 ajv-formats@3
          shopt -s nullglob
          fail=0
          for f in cases/*/case.json; do
            echo "validating $f"
            ajv validate -s schemas/case.schema.json -d "$f" --spec=draft2020 --strict=false -c ajv-formats || fail=1
          done
          exit $fail

      - name: 📦 Publish backend
        run: dotnet publish -c Release -o ./publish
        working-directory: ./backend/CaseZeroApi

      - name: 📤 Upload backend artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-build
          path: ./backend/CaseZeroApi/publish

      - name: 📤 Upload frontend artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: ./frontend/dist

      - name: 🔧 Setup .NET 9 (for functions)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_FUNCTIONS_VERSION }}

      - name: 📦 Publish CaseGen.Functions
        run: dotnet publish -c Release -o ./publish
        working-directory: ./functions/CaseGen.Functions

      - name: 📤 Upload functions artifacts
        uses: actions/upload-artifact@v4
        with:
          name: functions-build
          path: ./functions/CaseGen.Functions/publish
          include-hidden-files: true  # .azurefunctions/ is required by Flex Consumption

  deploy-to-dev:
    name: 🚀 Deploy to Development
    runs-on: ubuntu-latest
    needs: build-and-test
    environment: development

    steps:
      - name: 📥 Checkout (for EF migrations)
        uses: actions/checkout@v4

      - name: 📥 Download backend artifacts
        uses: actions/download-artifact@v4
        with:
          name: backend-build
          path: ./artifacts/backend

      - name: 📥 Download frontend artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: ./artifacts/frontend

      - name: 📥 Download functions artifacts
        uses: actions/download-artifact@v4
        with:
          name: functions-build
          path: ./artifacts/functions

      - name: 🔐 Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS_DEV }}

      - name: 🚀 Deploy Backend to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: 'production'
          package: ./artifacts/backend

      - name: 🧮 Deploy CaseGen.Functions
        run: |
          if ! az functionapp show --name ${{ env.AZURE_FUNCTIONAPP_NAME }} --resource-group ${{ env.AZURE_FUNCTIONAPP_RG }} >/dev/null 2>&1; then
            echo "⚠️ Function App ${{ env.AZURE_FUNCTIONAPP_NAME }} not found. Skipping function deploy."
            echo "skip=true" >> $GITHUB_OUTPUT
          fi
        id: check-func

      - name: 🧮 Deploy CaseGen.Functions (RBAC)
        if: steps.check-func.outputs.skip != 'true'
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          package: ./artifacts/functions

      - name: 🌐 Deploy Frontend to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_DEV }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: 'upload'
          app_location: './artifacts/frontend'
          skip_app_build: true
          skip_api_build: true

  notify-deployment:
    name: 📢 Deployment Summary
    runs-on: ubuntu-latest
    needs: [build-and-test, deploy-to-dev]
    if: always()
    
    steps:
      - name: � Deployment Summary
        run: |
          echo "## 🚀 CaseZero DEV Deployment"
          echo ""
          echo "**Status:** ${{ needs.deploy-to-dev.result == 'success' && '✅ Success' || '❌ Failed' }}"
          echo "**Environment:** Development"
          echo "**Branch:** ${{ github.ref_name }}"
          echo "**Commit:** ${{ github.sha }}"
          echo "**Triggered by:** ${{ github.actor }}"
          echo ""
          echo "### 🌐 Application URLs:"
          echo "- Backend: https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net"
          echo "- Frontend: https://${{ env.AZURE_STATIC_WEB_APP_NAME }}.azurestaticapps.net"
          echo ""
          if [ "${{ needs.deploy-to-dev.result }}" == "success" ]; then
            echo "✅ DEV environment is ready!"
          else
            echo "⚠️ Please check the deployment logs for issues."
          fi